[project]
name = "cell-tracking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dask[distributed]>=2024.8.0",
    "geff>=1.2.0.1.1",
    "jupyterlab>=4.5.9",
    "kaggle>=1.7.4.5",
    "matplotlib>=3.9.4",
    "napari[all]>=0.5.6",
    "networkx>=3.6.1",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "scikit-image>=0.24.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "tifffile>=2026.7.14",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.68.4",
    "tracksdata>=0.1.0rc6",
    "zarr>=3.0.10,<4",
]

[project.optional-dependencies]
ilp = [
    "ilpy>=0.5.1",
    "pyscipopt>=6.2.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "pytest>=8.4.2",
    "ruff>=0.15.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:napari"
filterwarnings = ["ignore::DeprecationWarning"]